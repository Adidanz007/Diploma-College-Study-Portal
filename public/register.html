<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Anjuman Portal</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <main class="auth-card">
        <h1>Register</h1>
        <p id="auth-message" class="auth-message" role="alert"></p>
        <form data-auth-form data-mode="register">
            <label>
                <span class="sr-only">Name</span>
                <input type="text" name="name" placeholder="Enter your name" maxlength="100" required autocomplete="name">
            </label>
            <label>
                <span class="sr-only">Email</span>
                <input type="email" name="email" placeholder="Enter your email" required autocomplete="email">
            </label>
            <label>
                <span class="sr-only">Password</span>
                <input type="password" name="password" placeholder="Create a password (8-72 characters)" minlength="8" maxlength="72" required autocomplete="new-password">
            </label>
            <label>
                <span class="sr-only">Confirm password</span>
                <input type="password" name="confirmPassword" placeholder="Confirm your password" minlength="8" maxlength="72" required autocomplete="new-password">
            </label>
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="/login.html">Login now</a></p>
        <p><a href="/">Back to home</a></p>
    </main>
    <script src="/js/auth.js"></script>
</body>
</html>
